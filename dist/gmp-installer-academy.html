<title>GMP Access — Installer Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>/* ============================================================
   GMP Access Installer Academy — design system v2
   Airy light + frosted accents. Icon rail + merged home page.
   ============================================================ */

:root{
  --bg:#fafaf8;
  --surface:#ffffff;
  --surface-2:#f5f5f2;
  --frost:rgba(255,255,255,.72);
  --frost-heavy:rgba(255,255,255,.86);
  --ink:#20242a;
  --ink-2:#494f58;
  --muted:#7a808a;
  --line:#ebe9e4;
  --line-2:#dcd9d2;
  --accent:#b45309;
  --accent-bright:#f59e0b;
  --accent-soft:#fdf6ea;
  --good:#2e7d4f;
  --good-soft:#f0f9f3;
  --bad:#bb3535;
  --bad-soft:#fdf4f4;
  --info:#3563c4;
  --info-soft:#f3f7fd;
  --dark:#171b21;
  --dark-2:#20262e;
  --dark-3:#2b323c;
  --dark-ink:#e8eaee;
  --dark-muted:#9aa3b2;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail-w:78px;
  --radius:12px;
  --shadow:0 1px 2px rgba(32,36,42,.04),0 6px 24px rgba(32,36,42,.05);
  --shadow-float:0 8px 40px rgba(32,36,42,.14);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.08em .35em;white-space:nowrap}
pre{background:var(--dark);color:#d7dce4;border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.85rem;line-height:1.6}
pre code{background:none;border:none;color:inherit;padding:0;white-space:pre}

/* ---------- layout: icon rail + main ---------- */
.app{min-height:100vh}
.rail{
  position:fixed;top:0;bottom:0;left:0;width:var(--rail-w);z-index:60;
  background:var(--frost);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;
}
.rail-logo{
  width:44px;height:44px;border-radius:12px;background:var(--dark);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;
  letter-spacing:.02em;margin-bottom:12px;flex:0 0 auto;
}
.rail-item{
  width:64px;padding:9px 2px 7px;border-radius:11px;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2);
  font-family:inherit;font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.rail-item .ri{font-size:1.15rem;line-height:1}
.rail-item:hover{background:rgba(32,36,42,.05);text-decoration:none;color:var(--ink)}
.rail-item.active{background:var(--accent-soft);color:var(--accent)}
.rail-spacer{flex:1}
.rail-progress{width:44px;text-align:center;font-size:.62rem;font-weight:800;color:var(--muted)}
.rail-progress .ring{margin:0 auto 3px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;color:var(--accent)}

/* curriculum slide-over panel */
.nav-panel{
  position:fixed;top:0;bottom:0;left:var(--rail-w);width:344px;z-index:55;
  background:var(--frost-heavy);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--line);box-shadow:var(--shadow-float);
  transform:translateX(-110%);transition:transform .26s ease;overflow-y:auto;padding:18px 14px 30px;
}
body.panel-open .nav-panel{transform:none}
.nav-panel .np-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.nav-panel .np-head b{font-size:.95rem}
.np-close{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--muted);padding:4px 8px}
.np-section{padding:12px 8px 4px;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}
.np-link{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);
  font-size:.85rem;cursor:pointer;
}
.np-link:hover{background:rgba(32,36,42,.05);text-decoration:none}
.np-link.active{background:var(--accent-soft);color:var(--accent)}
.np-link .mcode{font-family:var(--mono);font-size:.64rem;color:var(--muted);flex:0 0 28px}
.np-link.active .mcode{color:var(--accent)}
.np-link .tick{margin-left:auto;font-size:.7rem;color:var(--good)}
.np-link .tick.partial{color:var(--accent-bright)}
.panel-scrim{display:none}
body.panel-open .panel-scrim{display:block;position:fixed;inset:0;z-index:54;background:rgba(32,36,42,.14)}

.main{margin-left:var(--rail-w);min-width:0;display:flex;flex-direction:column;min-height:100vh}
.content{flex:1;width:100%;max-width:1020px;margin:0 auto;padding:30px 44px 96px}
.content.wide{max-width:1160px}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--frost);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;
}
.topbar .crumb{font-size:.8rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--ink)}
.hamburger{display:none;background:none;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;font-size:1rem;cursor:pointer;color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;
  border-radius:9px;padding:9px 16px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn:hover{background:#000;text-decoration:none;color:#fff}
.btn.secondary{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--line-2)}
.btn.secondary:hover{background:var(--surface)}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:#92400e}
.btn.small{padding:6px 12px;font-size:.78rem}
.btn.ghost{background:none;color:var(--accent);border:none;padding:6px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- typography ---------- */
.kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2.page-title{font-size:1.9rem;line-height:1.15;margin:6px 0 10px;letter-spacing:-.02em;font-weight:750}
.lede{font-size:1.04rem;color:var(--ink-2);max-width:70ch}
.prose h3{font-size:1.28rem;margin:2.2em 0 .5em;letter-spacing:-.01em;scroll-margin-top:80px}
.prose h4{font-size:1.04rem;margin:1.8em 0 .4em;scroll-margin-top:80px}
.prose p{margin:.7em 0;max-width:72ch}
.prose ul,.prose ol{padding-left:1.4em;max-width:70ch}
.prose li{margin:.35em 0}
.prose hr{border:none;border-top:1px solid var(--line);margin:2.2em 0}

/* ---------- cards & callouts ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.callout{border-radius:var(--radius);padding:14px 18px;margin:1.2em 0;border:1px solid var(--line);background:var(--surface);font-size:.94rem}
.callout .co-label{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:4px;color:var(--ink-2)}
.callout.warn{background:var(--accent-soft);border-color:#f0e2c4}
.callout.warn .co-label{color:var(--accent)}
.callout.danger{background:var(--bad-soft);border-color:#f2dcdc}
.callout.danger .co-label{color:var(--bad)}
.callout.field{background:var(--info-soft);border-color:#dde7f6}
.callout.field .co-label{color:var(--info)}
.callout.ambiguity{background:#f8f6fe;border-color:#e6e0f5}
.callout.ambiguity .co-label{color:#7c5cbf}
.callout.good{background:var(--good-soft);border-color:#d8ecdf}
.callout.good .co-label{color:var(--good)}
.callout p:first-of-type{margin-top:0}
.callout p:last-child,.callout ul:last-child,.callout ol:last-child{margin-bottom:0}

.steps{list-style:none;padding:0;margin:1.2em 0;counter-reset:step}
.steps>li{
  counter-increment:step;position:relative;padding:14px 18px 14px 62px;margin:10px 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-width:none;
}
.steps>li::before{
  content:counter(step);position:absolute;left:16px;top:14px;width:30px;height:30px;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;
}
.steps>li b:first-child{display:block;margin-bottom:2px}
.steps>li p{margin:.4em 0;max-width:68ch}
.steps>li ul{margin:.4em 0}

.tablewrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.spec{border-collapse:collapse;width:100%;font-size:.9rem}
table.spec th{
  text-align:left;background:var(--surface-2);color:var(--ink-2);padding:10px 14px;font-size:.7rem;
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--line-2);
}
table.spec td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
table.spec td:first-child{font-weight:600;white-space:nowrap}
table.spec.wraprow td:first-child{white-space:normal}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:1.2em 0}
.kv .k{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kv .k .lab{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv .k .val{font-size:1.02rem;font-weight:700;margin-top:2px}
.kv .k .val.mono{font-family:var(--mono);font-size:.9rem}

.figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:1.4em 0;overflow-x:auto}
.figure figcaption{font-size:.8rem;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.figure svg{display:block;margin:0 auto}
.src{font-size:.72rem;color:var(--muted);font-style:italic}

/* ---------- merged home: collapsible sections ---------- */
.home-hero{padding:26px 4px 6px}
.home-hero .kicker{color:var(--accent)}
.home-hero h2{font-size:2rem;letter-spacing:-.02em;margin:.15em 0 .2em;font-weight:750}
.home-hero p{color:var(--muted);max-width:66ch;margin:.2em 0 1em}
.home-hero .hero-actions{display:flex;gap:10px;flex-wrap:wrap}

details.sect{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  margin:14px 0;overflow:hidden;
}
details.sect>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 22px;
  user-select:none;
}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary:hover{background:var(--surface-2)}
.sect-ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:0 0 auto}
.sect-tt{flex:1;min-width:0}
.sect-tt b{display:block;font-size:1.02rem;letter-spacing:-.01em}
.sect-tt span{display:block;font-size:.78rem;color:var(--muted)}
.sect-meta{font-size:.74rem;color:var(--muted);font-weight:600;white-space:nowrap}
.sect-chev{color:var(--muted);transition:transform .2s;font-size:.8rem}
details.sect[open]>summary .sect-chev{transform:rotate(90deg)}
.sect-body{padding:6px 22px 24px;border-top:1px solid var(--line)}

/* phase accordions inside curriculum */
details.phase{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:var(--surface)}
details.phase>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px}
details.phase>summary::-webkit-details-marker{display:none}
details.phase>summary:hover{background:var(--surface-2)}
.ph-num{font-family:var(--mono);font-size:.68rem;color:var(--accent);font-weight:800;letter-spacing:.08em;flex:0 0 auto}
.ph-title{flex:1;font-weight:700;font-size:.92rem}
.ph-meta{font-size:.72rem;color:var(--muted)}
details.phase .mod-grid{padding:4px 14px 16px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:4px 0 6px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px}
.stat .n{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s;
  color:var(--ink);
}
.mod-card:hover{border-color:var(--accent-bright);box-shadow:var(--shadow);text-decoration:none}
.mod-card .mc-top{display:flex;justify-content:space-between;align-items:center}
.mod-card .mcode{font-family:var(--mono);font-size:.68rem;color:var(--accent);font-weight:700}
.mod-card h4{margin:0;font-size:.99rem;line-height:1.35}
.mod-card .mc-tag{font-size:.8rem;color:var(--muted);flex:1}
.mod-card .mc-meta{display:flex;gap:14px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:5px}
.badge{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;padding:3px 10px}
.badge.done{background:var(--good-soft);color:var(--good)}
.badge.progress{background:var(--accent-soft);color:var(--accent)}
.badge.todo{background:var(--surface-2);color:var(--muted)}

/* field kit cards (light, on home) */
.fk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fk-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  color:var(--ink);cursor:pointer;display:block;transition:border-color .15s,box-shadow .15s;
}
.fk-card:hover{border-color:var(--accent-bright);box-shadow:var(--shadow);text-decoration:none}
.fk-card .fc-ico{font-size:1.2rem}
.fk-card h4{margin:8px 0 3px;font-size:.94rem}
.fk-card p{margin:0;font-size:.77rem;color:var(--muted)}
.fk-note{font-size:.78rem;color:var(--muted);margin:2px 0 14px}

/* glossary on home */
.gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.gloss-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.gloss-card h4{margin:10px 0 6px;font-size:.97rem}
.gloss-card p{margin:0 0 8px;font-size:.83rem;color:var(--ink-2);line-height:1.55}
.gloss-card a{font-size:.74rem;font-weight:700}
.wl-ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}

/* reference row on home */
.ref-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

/* ---------- intro (inline, in Start here section) ---------- */
.intro-slide{text-align:center;padding:8px 4px 0}
.intro-slide .figure{border:none;padding:6px 0;margin:0;background:none}
.wl-terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:11px;margin:18px auto 4px;text-align:left}
.wl-term{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px}
.wl-term b{display:block;margin:8px 0 3px;font-size:.9rem}
.wl-term span{font-size:.78rem;color:var(--muted);line-height:1.45;display:block}
.wl-field-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;background:var(--dark);border-radius:12px;padding:16px;margin:16px 0 10px}
.wl-fc{background:var(--dark-2);border:1px solid var(--dark-3);color:var(--dark-ink);border-radius:9px;padding:11px;font-size:.8rem;font-weight:600;display:flex;gap:9px;align-items:center}
.wl-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.wl-dots{display:flex;gap:8px}
.wl-dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);cursor:pointer}
.wl-dot.on{background:var(--accent);transform:scale(1.3)}
.intro-title{font-size:1.4rem;font-weight:750;letter-spacing:-.015em;margin:.3em 0 .4em}

/* ---------- module / lesson ---------- */
.lesson-list{list-style:none;padding:0;margin:1.2em 0}
.lesson-list li{margin:8px 0}
.lesson-row{
  display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 18px;color:var(--ink);cursor:pointer;
}
.lesson-row:hover{border-color:var(--accent-bright);text-decoration:none}
.lesson-row .num{font-family:var(--mono);font-size:.7rem;color:var(--muted);flex:0 0 40px}
.lesson-row .t{flex:1;font-weight:600}
.lesson-row .state{font-size:.74rem;color:var(--muted)}
.lesson-row .state.done{color:var(--good);font-weight:700}
.objectives{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin:1.2em 0}
.objectives h4{margin:0 0 8px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.objectives ul{margin:0;padding-left:1.3em}
.objectives li{margin:.3em 0;font-size:.92rem}
.lesson-nav{display:flex;gap:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}
.lesson-nav .spacer{flex:1}
.lesson-meta{display:flex;gap:16px;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:22px;flex-wrap:wrap}

/* ---------- quiz ---------- */
.quiz-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:16px 0}
.quiz-q .qnum{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.quiz-q .scenario-tag{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--info-soft);color:var(--info);border-radius:20px;padding:3px 10px;margin-left:8px}
.quiz-q h4{margin:.4em 0 .8em;font-size:1.02rem;line-height:1.5}
.opt{
  display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;
  padding:11px 14px;margin:8px 0;cursor:pointer;font-size:.94rem;background:var(--surface-2);
}
.opt:hover{border-color:var(--accent-bright)}
.opt .dot{flex:0 0 22px;height:22px;border:2px solid var(--line-2);border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:800;color:transparent}
.opt.selected{border-color:var(--ink);background:var(--surface)}
.opt.selected .dot{border-color:var(--ink);background:var(--ink);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .dot{border-color:var(--good);background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .dot{border-color:var(--bad);background:var(--bad);color:#fff}
.explain{border-left:3px solid var(--good);background:var(--good-soft);padding:12px 16px;border-radius:0 9px 9px 0;margin-top:12px;font-size:.9rem}
.explain.miss{border-left-color:var(--bad);background:var(--bad-soft)}
.quiz-score{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:26px;text-align:center;margin:20px 0}
.quiz-score .big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
.quiz-score p{color:var(--muted)}

/* ---------- field mode (dark, on-site card views) ---------- */
body.field-mode{background:#0f1216}
body.field-mode .topbar{background:rgba(15,18,22,.72);border-bottom-color:var(--dark-3)}
body.field-mode .topbar .crumb,body.field-mode .topbar .crumb b{color:var(--dark-ink)}
body.field-mode .hamburger{color:var(--dark-ink);border-color:var(--dark-3)}
.field-wrap{max-width:860px;margin:0 auto;padding:24px 20px 90px;color:var(--dark-ink)}
.field-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.field-head h2{margin:0;font-size:1.4rem;color:#fff;letter-spacing:-.01em}
.field-head .kicker{color:var(--accent-bright)}
.field-panel{background:var(--dark-2);border:1px solid var(--dark-3);border-radius:14px;padding:20px;margin:14px 0}
.field-panel h3{margin:0 0 12px;color:#fff;font-size:1.1rem}
.field-panel h4{color:var(--accent-bright);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px}
.field-panel table.spec th{background:#000;color:var(--dark-muted);border-bottom-color:var(--dark-3)}
.field-panel table.spec td{border-top-color:var(--dark-3);color:var(--dark-ink)}
.field-panel .tablewrap{border-color:var(--dark-3);background:var(--dark-2)}
.field-panel code{background:#000;border-color:var(--dark-3);color:#fbbf24}
.field-panel li{margin:.45em 0}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{
  display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--dark-3);
  font-size:.94rem;cursor:pointer;
}
.checklist li .box{flex:0 0 22px;height:22px;border:2px solid var(--dark-muted);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem;font-weight:800}
.checklist li.done .box{background:var(--good);border-color:var(--good);color:#fff}
.checklist li.done .txt{opacity:.5;text-decoration:line-through}
.checklist li .why{display:block;font-size:.78rem;color:var(--dark-muted)}
.light .checklist li{border-bottom-color:var(--line)}
.light .checklist li .box{border-color:var(--line-2)}

/* ---------- coverage ---------- */
.cov-row td:first-child{white-space:normal;min-width:220px}

/* ---------- search ---------- */
.search-box{position:relative;flex:0 0 260px}
.search-box input{
  width:100%;padding:8px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:.84rem;
  font-family:inherit;background:rgba(255,255,255,.75);color:var(--ink);
}
.search-box input:focus{outline:2px solid var(--accent-bright);border-color:transparent;background:var(--surface)}
.search-results{
  position:absolute;top:42px;right:0;width:420px;max-width:80vw;max-height:60vh;overflow-y:auto;
  background:var(--frost-heavy);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-float);z-index:70;
}
.search-results a{display:block;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink);font-size:.84rem}
.search-results a:hover{background:rgba(255,255,255,.8);text-decoration:none}
.search-results a .where{display:block;font-size:.7rem;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.search-results .none{padding:14px;color:var(--muted);font-size:.84rem}

/* ---------- spotlight tour ---------- */
.tour-scrim{position:fixed;inset:0;z-index:200;background:transparent}
.tour-hole{position:fixed;z-index:201;border-radius:12px;box-shadow:0 0 0 6000px rgba(24,27,32,.5);pointer-events:none;transition:all .3s ease}
.tour-tip{position:fixed;z-index:202;background:var(--frost-heavy);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-float);padding:16px 18px}
.tour-tip h4{margin:6px 0 6px;font-size:1.02rem}
.tour-tip p{margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.55}
.tour-btns{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tour-btns a{font-size:.78rem;color:var(--muted)}

/* ---------- ui icons ---------- */
.ui-ico{vertical-align:-.18em;flex:0 0 auto}
.btn .ui-ico{vertical-align:-.14em}
.flag-bad{color:var(--bad)}
.sect-ico .ui-ico{color:var(--accent)}
.rail-item .ri .ui-ico{display:block;margin:0 auto}
.fc-ico .ui-ico{color:var(--accent)}
.lesson-row .num .ui-ico{color:var(--muted)}
.score-pill .ui-ico{vertical-align:-.16em}

/* ---------- admin & exam integrity ---------- */
.ad-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ad-tab{padding:7px 14px;border-radius:20px;font-size:.82rem;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.ad-tab:hover{border-color:var(--accent-bright);text-decoration:none}
.ad-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ad-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ad-in{padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:.86rem;font-family:inherit;background:var(--surface);color:var(--ink)}
.ad-in:focus{outline:2px solid var(--accent-bright);border-color:transparent}
textarea.ad-in{resize:vertical}
.score-pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.8rem;font-weight:800}
.score-pill.ok{background:var(--good-soft);color:var(--good)}
.score-pill.mid{background:var(--accent-soft);color:var(--accent)}
.score-pill.low{background:var(--bad-soft);color:var(--bad)}
.rate-row{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:6px 0;font-size:.9rem;cursor:pointer;background:var(--surface)}
.rate-row:hover{border-color:var(--accent-bright)}
.rate-row input{width:17px;height:17px;accent-color:var(--accent)}
.exam-cover{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px;margin:18px 0;max-width:640px}
.exam-rules{font-size:.78rem;color:var(--muted);margin:.6em 0 0}
.exam-live-bar{
  position:sticky;top:58px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--frost-heavy);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:11px;
  padding:9px 16px;margin:14px 0;font-size:.82rem;color:var(--ink-2);
}

/* ---------- print guide ---------- */
.print-controls{position:sticky;top:0;z-index:30;background:var(--frost);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center}
.guide{max-width:820px;margin:0 auto;padding:40px 30px;background:var(--surface)}
.guide .g-cover{text-align:center;padding:80px 0;border-bottom:3px solid var(--ink);margin-bottom:40px}
.guide .g-cover h1{font-size:2.4rem;margin:.2em 0;letter-spacing:-.02em}
.guide .g-module{page-break-before:always;margin-top:50px}
.guide .g-module>h2{font-size:1.6rem;border-bottom:2px solid var(--ink);padding-bottom:8px}
.guide .g-lesson>h3{font-size:1.2rem;margin-top:1.8em}

@media print{
  .rail,.nav-panel,.topbar,.print-controls,.lesson-nav,.no-print{display:none!important}
  .main{margin-left:0}
  body{background:#fff;font-size:11pt}
  .guide{padding:0;max-width:none}
  .callout,.figure,.steps>li,.tablewrap{break-inside:avoid}
  a{color:inherit}
  pre{white-space:pre-wrap;border:1px solid #999;background:#fff;color:#000}
  .field-panel code{color:#000}
}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .rail{top:auto;bottom:0;left:0;right:0;width:auto;height:64px;flex-direction:row;justify-content:space-around;padding:6px 8px;border-right:none;border-top:1px solid var(--line)}
  .rail-logo,.rail-spacer,.rail-progress{display:none}
  .rail-item{width:auto;min-width:56px;padding:6px 6px}
  .main{margin-left:0;padding-bottom:70px}
  .nav-panel{left:0;width:min(360px,88vw)}
  .content{padding:22px 20px 90px}
  .search-box{flex:1}
}
@media(max-width:640px){
  body{font-size:15px}
  h2.page-title{font-size:1.45rem}
  .home-hero h2{font-size:1.5rem}
  .content{padding:16px 14px 90px}
  .steps>li{padding-left:54px}
  .steps>li::before{left:12px;width:26px;height:26px}
  .topbar{padding:10px 14px}
  .topbar .crumb{display:none}
  .search-results{right:-60px}
  details.sect>summary{padding:14px 16px}
  .sect-body{padding:6px 16px 20px}
  .sect-meta{display:none}
}

      <text x="560" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="${C.ink}">Gate control board / PSU</text>`;
    rows.forEach(r => {
      s += `<rect x="180" y="${r.y - 12}" width="50" height="24" rx="4" fill="#fff" stroke="${r.col}" stroke-width="1.6"/>

<p><strong>GMP Access</strong> — commonly referred to as the <strong>GMP IoT GateKit</strong> — is a digital access control system specifically designed for <strong>gated parking garages</strong>. It includes hardware installed in two places: at the <strong>entry/exit lanes</strong>, and in the <strong>parking office</strong>. The system leverages <strong>LPR (license plate recognition) cameras</strong> and <strong>unattended payment terminals</strong> to enable seamless, <strong>ticketless</strong> entry and exit.</p>

<h4>How a ticketless pass-through actually happens</h4>
<p>Walk the chain of events for a car exiting a garage, because every device you will install exists to serve one link of it:</p>
<ol>

<h4>The two loops</h4>
<p>Inductive loops are coils of wire in the pavement that detect metal above them. A GMP lane typically integrates <strong>two loops per lane</strong> (though depending on the lane setup, only one may be used):</p>
<div class="tablewrap"><table class="spec">

<h4>The gate arm and "vend"</h4>
<p><strong>Vend</strong> is industry shorthand for commanding the gate to open. The existing PARCS gate already knows how to raise and lower its arm; our job is to give the GMP platform a wired path to trigger it. That path is the WISE controller's relay output (RL0), wired to the gate control board's vend input. Module M08 teaches the exact terminals.</p>
<h4>The LPR camera</h4>
<p>One LPR camera per lane, running on <strong>PoE or PoE+</strong> (PoE+ recommended for stable performance — make sure compatible network switches are used). Whether it reads the <em>rear</em> plate of a car that has passed it or the <em>front</em> plate of a car approaching it is a placement decision with precise distance rules (Module M09).</p>

<p>The <strong>Advantech WISE 4060-LAN-B</strong> is an <strong>Ethernet IO module</strong> containing <strong>digital inputs</strong> and <strong>dry-contact relays</strong> for output operations. Typically, <strong>one unit is deployed at each lane</strong> to read the loops and open the gate. These controllers are also used to connect <strong>pedestrian doors</strong> to the digital platform — the same input/relay pattern generalizes beyond vehicle gates.</p>
${src('"WISE 4060-LAN-B IO Unit", p.5')}
<div class="kv">
  <div class="k"><span class="lab">Role</span><span class="val">Loops in, vend out</span></div>
  <div class="k"><span class="lab">Quantity</span><span class="val">1 per lane</span></div>
  <div class="k"><span class="lab">Install location</span><span class="val">Inside the gate cabinet</span></div>

  <div class="k"><span class="lab">Network</span><span class="val">CAT6 to nearest switch</span></div>
  <div class="k"><span class="lab">Default IP</span><span class="val mono">10.0.0.1</span></div>
</div>
<figure class="figure">[[DIAGRAM:wiseBoard]]<figcaption>The only terminals you will ever touch on the WISE 4060: two for power, three for the loops, one relay pair for the vend, and the LAN port.</figcaption></figure>
<p>Why "dry contact" matters to you as an installer: the relay is a clean, isolated switch — it doesn't inject voltage into the gate board; it simply closes a circuit the gate board already provides. That's what makes the GateKit compatible with existing PARCS gates: you wire the relay across the gate's own vend input (M08), and the gate behaves as if its native ticket system commanded it.</p>
<h4>Terminals you will actually touch</h4>
<div class="tablewrap"><table class="spec">
<tr><th>Terminal</th><th>Function</th><th>Used for</th></tr>

<tr><td><code>DI0</code></td><td>Digital input 0</td><td>Presence loop signal</td></tr>
<tr><td><code>DI1</code></td><td>Digital input 1</td><td>Safety loop signal</td></tr>
<tr><td><code>DICOM</code></td><td>Digital input common</td><td>Shared common for DI0/DI1, wired to the gate board</td></tr>
<tr><td><code>RL0+</code> / <code>RL0−</code></td><td>Relay output 0</td><td>Gate arm vend circuit</td></tr>
</table></div>
<p>On the WISE board, <strong>the connection ports remain consistent for respective loops and gate functions across gate models</strong> — the gate-side terminals vary by manufacturer, but your side of the wiring doesn't. Full wiring detail is Module M08.</p>
<div class="callout spec"><span class="co-label">Procurement</span><p>US purchase sources named in the guide: <strong>Mouser Electronics</strong> and <strong>DigiKey</strong>. The datasheet referenced is <code>WISE_4000_LAN_DS</code>. (Live links are embedded in the source PDF.)</p></div>`

<p>You have two legitimate supply options:</p>

</ul></div>

<div class="callout field"><span class="co-label">Field note</span><p>Decide the power source per gate during the site walk, not on install day. If the gate's DC supply is crowded or undocumented, budget a standalone supply — they're cheap, and a dedicated supply removes one variable when you're debugging loop signals later.</p></div>`

<p>The placement pattern is one of the guide's most important cabling ideas: the switch is <strong>installed inside the ticket-dispenser housing</strong>, where it uses the <strong>existing network line from the server room</strong>. That single existing line then fans out locally:</p>
<ul>

  <li>→ WISE IO controller at the gate (data; the IO board takes DC power separately)</li>
  <li>→ the ticket machine itself, if it needs the connection back</li>
</ul>
<figure class="figure">[[DIAGRAM:poeFanout]]<figcaption>The cabling idea that makes retrofits cheap: one existing line into the dispenser housing, a PoE+ switch inside it, short local runs out.</figcaption></figure>
<p>This is why the site walk checks <em>power and network port availability in all ticket dispensers</em> (M07): each dispenser usually already has a network line from the server room, and the whole lane design leans on reusing it. You need <strong>AC power available for the switch</strong> inside the housing — or plan to install an extension board with a power receptacle.</p>
${src('"PoE+ Switch", p.6; "Site Walk" item 7, pp.18–19')}
<div class="callout warn"><span class="co-label">Camera power compatibility</span><p>The LPR camera runs on PoE or PoE+, and <strong>PoE+ is recommended for stable performance — ensure compatible network switches are used</strong>. If reads drop out intermittently, an underpowered PoE budget is a prime suspect.</p></div>
<p>Existing network lines can be used <strong>provided they have internet access</strong>, because the ASUS NUC will be installed on the same network — the lane devices and the NUC must see each other (ports 80/1883/4000/4001 internally; Module M14 has the full table).</p>`

<p>To ensure accurate license plate reads, it's essential to <strong>control vehicle speed</strong> in your entry and exit lanes. Slowing cars down momentarily at key points ensures better camera performance — a plate crossing the read zone too fast is the cheapest way to ruin an otherwise perfect install.</p>

</div>

<p><em>Why:</em> <strong>note all ports used by existing wires</strong>, and <strong>check if any third-party systems (e.g., Vend or Parkonect) are deployed</strong>. Someone else's controller wired into the vend circuit changes your install plan — you need to know whose wires you're sharing a terminal block with.</p>

<li><b>Connect DI1 on the WISE Board → NC4 terminal on the gate control board</b></li>

<ol class="steps">

<div class="callout ambiguity"><span class="co-label">Source note (NO5 vs NC5)</span><p>The source's descriptive text says the presence-loop indicator lights at the <strong>NO5</strong> pin and the ticket dispenser's signal wire sits on <strong>NO5</strong>, while its connection instruction says to land <strong>DI0 on NC5</strong>. Both statements are reproduced here exactly as printed. On-site, verify with the metal-object test that your chosen terminal actually transitions when the loop activates before finalizing.</p></div>

        html: `
<p><strong>The feasibility of LPR deployment depends on whether rear-plate reading is possible.</strong> This is especially important in <strong>entry lanes, where vehicles may come directly off the street</strong>, making it challenging to capture plates effectively. Mounting positions vary with the camera's capabilities and the availability of space at the site — which is why the site walk measured every approach length (M07 item 2).</p>
<div class="tablewrap"><table class="spec">
<tr><th>Strategy</th><th>Reads</th><th>Needs</th><th>Typical use</th></tr>
<tr><td>Rear-read</td><td>Rear plate of a vehicle that has passed the camera</td><td>25–30 ft of approach before the dispenser</td><td>Preferred where geometry allows; the standard lane diagrams (M01) show it</td></tr>
<tr><td>Front-read</td><td>Front plate of an approaching vehicle</td><td>Space 5–10 ft beyond the dispenser, inside the lane</td><td>Short approaches, street-fed entries, auto-vend exits</td></tr>

${src('"LPR Position", p.24')}
<div class="callout field"><span class="co-label">Why rear-read is the default</span><p>The camera sits behind the car looking at a plate that's motionless (car stopped at the dispenser/kiosk), at a shallow angle, with no headlights in the lens. Front-read trades that comfort for placement flexibility — and pays for it with glare management.</p></div>`

        id: 'l2', title: 'Rear-read geometry: the numbers', minutes: 14,

<p>A typical camera's <strong>operating range is 1–6 m (3–20 ft)</strong>. The placement math from the source:</p>
<ul>
  <li>Assuming a <strong>15 ft vehicle</strong> and a <strong>10 ft distance from the rear to the driver's seat</strong> (where the ticket dispenser aligns when the car enters the lane), the camera should be placed <strong>25–30 ft before the ticket dispenser</strong>. This range allows for optimal read quality and angle.</li>
  <li>If you're using a camera <strong>with optical zoom</strong>, place it <strong>25–30 ft before the ticket dispenser</strong> as well.</li>
</ul>

  <div class="k"><span class="lab">Mount height</span><span class="val">8–10 ft</span></div>
  <div class="k"><span class="lab">Camera tilt</span><span class="val">30–45°</span></div>
  <div class="k"><span class="lab">From kiosk</span><span class="val">25–30 ft</span></div>
  <div class="k"><span class="lab">Gate → camera</span><span class="val">30–35 ft</span></div>
  <div class="k"><span class="lab">Operating range</span><span class="val">1–6 m (3–20 ft)</span></div>
</div>
<p>Two absolute rules ride along with the numbers:</p>
<ul>

  <li><strong>Always mount the camera upright.</strong></li>

  <li><strong>Pole-mounted cameras should be at least 8–10 ft high to avoid headlight glare</strong> from approaching vehicles.</li>

<div class="callout warn"><span class="co-label">The glare trap</span><p>Front-read means the camera faces oncoming headlights. Height is the defense — 8–10 ft minimum puts the lens above the beam pattern. A front-read camera at eye level will produce beautiful daytime reads and useless night reads.</p></div>`

/* ============================================================
   Exam integrity monitor ("focused session").
   Client-side scope — quietly records, never nags:
   - tab switches / window blur (visibilitychange, blur/focus)
   - time spent away from the exam
   - in-app navigation attempts during the exam
   - a second tab of this app opening in the SAME browser profile
     (BroadcastChannel lock; second tab is blocked + logged)
   - fullscreen exits (if the candidate entered fullscreen)
   Hard limits (documented, need a backend + login to solve):
   - incognito / another browser / another device cannot be
     detected or blocked without single-session auth tokens.
   ============================================================ */
(function () {
  'use strict';
  const P = {
    active: false,
    startedAt: null,
    events: [],
    awayMs: 0,
    _awaySince: null
  };
  window.PROCTOR = P;

  let bc = null;
  try { bc = new BroadcastChannel('gmp-academy-lock'); } catch (e) {}

  function log(type, detail) {
    if (!P.active) return;
    P.events.push({ t: Date.now(), type, detail: detail || '' });
  }

  P.note = log;

  P.start = function () {
    P.active = true;
    P.startedAt = Date.now();
    P.events = [];
    P.awayMs = 0;
    P._awaySince = null;
    try { sessionStorage.setItem('gmpExamActive', '1'); } catch (e) {}
    if (bc) bc.postMessage({ kind: 'exam-started' });
    log('start');
  };

  P.stop = function (outcome) {
    if (!P.active) return null;
    if (P._awaySince) { P.awayMs += Date.now() - P._awaySince; P._awaySince = null; }
    log('stop', outcome || 'finished');
    const summary = P.summary(outcome);
    P.active = false;
    try { sessionStorage.removeItem('gmpExamActive'); } catch (e) {}
    if (bc) bc.postMessage({ kind: 'exam-ended' });
    return summary;
  };

  P.summary = function (outcome) {
    const count = type => P.events.filter(e => e.type === type).length;
    return {
      outcome: outcome || 'finished',
      startedAt: P.startedAt,
      endedAt: Date.now(),
      durationSec: Math.round((Date.now() - P.startedAt) / 1000),
      tabSwitches: count('hidden'),
      windowBlurs: count('blur'),
      awaySeconds: Math.round(P.awayMs / 1000),
      navAttempts: count('nav-attempt'),
      secondTabs: count('second-tab'),
      fullscreenExits: count('fs-exit'),
      events: P.events.slice(0, 200)
    };
  };

  /* ---------- passive listeners ---------- */
  document.addEventListener('visibilitychange', () => {
    if (!P.active) return;
    if (document.hidden) { log('hidden'); P._awaySince = Date.now(); }
    else {
      log('visible');
      if (P._awaySince) { P.awayMs += Date.now() - P._awaySince; P._awaySince = null; }
    }
  });
  window.addEventListener('blur', () => log('blur'));
  window.addEventListener('focus', () => log('focus'));
  document.addEventListener('fullscreenchange', () => {
    if (P.active && !document.fullscreenElement) log('fs-exit');
  });
  window.addEventListener('beforeunload', () => {
    if (P.active) log('unload-attempt');
  });

  /* ---------- second-tab lock (same browser profile) ---------- */
  if (bc) {
    bc.onmessage = e => {
      const kind = e.data && e.data.kind;
      if (kind === 'hello') {
        // another tab of this app just opened
        if (P.active) { log('second-tab'); bc.postMessage({ kind: 'exam-active' }); }
      } else if (kind === 'exam-active') {
        // an exam is running in ANOTHER tab — block this one
        if (!P.active) showTabBlock();
      } else if (kind === 'exam-ended') {
        hideTabBlock();
      }
    };
    // announce ourselves on load
    setTimeout(() => bc.postMessage({ kind: 'hello' }), 300);
  }

  let blockEl = null;
  function showTabBlock() {
    if (blockEl) return;
    blockEl = document.createElement('div');
    blockEl.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(250,250,248,.96);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px';
    blockEl.innerHTML = '<div style="max-width:420px"><div style="color:#b45309">' + (window.UI ? window.UI('lock', 34) : '') + '</div><h3 style="margin:.4em 0">An exam is in progress in another window</h3><p style="color:#7a808a;font-size:.9rem">This page is paused until the exam in your other tab is submitted or abandoned.</p></div>';
    document.body.appendChild(blockEl);
  }
  function hideTabBlock() {
    if (blockEl) { blockEl.remove(); blockEl = null; }
  }
})();

    else if (step.pos === 'bottom') { top = r.bottom + pad; left = Math.min(window.innerWidth - tw - 16, Math.max(16, r.left + r.width / 2 - tw / 2)); }
    else { top = Math.max(70, r.top - pad - 160); left = Math.min(window.innerWidth - tw - 16, Math.max(16, r.left + r.width / 2 - tw / 2)); }
    if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 16;
    if (top < 8) top = r.bottom + pad;
    tip.style.cssText = `top:${top}px;left:${left}px;width:${tw}px`;
  }
  function finishTour() {
    endTour();
    const tip = document.createElement('div');
    tip.className = 'tour-tip tour-final';
    tip.innerHTML = `<h4>You're set.</h4><p>Start with <strong>M01 — What GMP Access Is & How a Lane Works</strong>. Everything else builds on it.</p>
      <div class="tour-btns"><a href="#" data-tour="close">Close</a><a class="btn accent small" href="#/module/m01" data-tour="close">Start M01 →</a></div>`;
    tip.style.cssText = `top:50%;left:50%;transform:translate(-50%,-50%);width:340px`;
    document.body.appendChild(tip);
    const kill = () => { tip.remove(); window.removeEventListener('hashchange', kill); };
    window.addEventListener('hashchange', kill);
    setTimeout(() => document.addEventListener('click', function once(e) {
      if (e.target.closest('[data-tour="close"]') || !e.target.closest('.tour-final')) { kill(); document.removeEventListener('click', once); }

  };

  /* ---------- event wiring ---------- */
  document.addEventListener('click', e => {
    const wl = e.target.closest('[data-wl]');
    if (wl) {
      e.preventDefault();
      const act = wl.dataset.wl;
      const st = A.appHooks.getState();
      if (act === 'next') { slideIdx = Math.min(slides.length - 1, slideIdx + 1); repaintSlide(); }
      else if (act === 'back') { slideIdx = Math.max(0, slideIdx - 1); repaintSlide(); }
      else if (act === 'tour') {
        st.onboarded = true; st.sections = st.sections || {}; st.sections.start = false;
        A.appHooks.save(); slideIdx = 0; A.startTour();
      }
      else if (act === 'start') {
        st.onboarded = true; st.sections = st.sections || {}; st.sections.start = false;

    }
    const dot = e.target.closest('[data-wl-dot]');
    if (dot) { slideIdx = +dot.dataset.wlDot; repaintSlide(); return; }
    const tr = e.target.closest('[data-tour]');
    if (tr) {
      if (tr.dataset.tour === 'next') { tourIdx++; showStep(); }
      else if (tr.dataset.tour === 'end') { e.preventDefault(); endTour(); }
      return;
    }
  });
  window.addEventListener('resize', () => { if (tourIdx >= 0 && tourEls) showStep(); });
  window.addEventListener('hashchange', () => { if (tourIdx >= 0) endTour(); });
})();

    ${input('site', 'Site name')} ${input('installerEmail', 'installer@partner.com', '', 'email')} ${input('date', '', '', 'date')}
    <select class="ad-in" name="status"><option>live</option><option>delayed</option><option>scheduled</option></select>
    <button class="btn small accent">Add</button>
  </form>
</details>
<div class="tablewrap"><table class="spec"><tr><th>Site</th><th>Installer</th><th>Go-live</th><th>Status</th><th>Installer issues</th><th>Rating</th></tr>${rows}</table></div>`;
  }

  function ratePanel(id) {
    const g = db.golives.find(x => x.id === decodeURIComponent(id));
    if (!g) return `<p>Go-live not found.</p>`;
    const existing = db.ratings.find(r => r.goLiveId === g.id) || { metrics: {}, note: '', badLaunch: false };
    const issues = (g.issues || []);
    return `
<a href="#/admin/golives" style="font-size:.82rem">← All go-lives</a>
<h3 style="margin:.6em 0 .2em">${esc(g.site)} — ${esc(g.installerEmail || 'unassigned')}</h3>
<p style="color:var(--muted);font-size:.85rem">${esc(g.id)} · ${esc(g.date || '')} · status: ${esc(g.status || '?')}</p>
${issues.length ? `<div class="callout ${issues.some(i => i.installerRelated) ? 'danger' : 'field'}"><span class="co-label">Issues from the tracker</span><ul style="margin:0">${issues.map(i => `<li>${esc(i.summary)}${i.installerRelated ? ' <b>(installer-related)</b>' : ''}${i.severity ? ' · ' + esc(i.severity) : ''}</li>`).join('')}</ul></div>` : ''}
<form data-ad="rate" data-gl="${esc(g.id)}">
  <h4 style="margin:1.2em 0 .4em">Rate this install — 1 point per metric</h4>
  ${A.METRICS.map(m => `<label class="rate-row"><input type="checkbox" name="${m[0]}"${existing.metrics[m[0]] ? ' checked' : ''}> ${esc(m[1])}</label>`).join('')}
  <h4 style="margin:1.2em 0 .4em">Launch notes</h4>
  <textarea class="ad-in" name="note" rows="3" style="width:100%" placeholder="What went well / what went bad at this launch…">${esc(existing.note)}</textarea>
  <label class="rate-row" style="margin-top:8px"><input type="checkbox" name="badLaunch"${existing.badLaunch ? ' checked' : ''}> ${UI('flag', 13, 'flag-bad')} Flag as a launch that went bad</label>
  <p><button class="btn accent">Save rating</button> <span id="rateScore" style="font-size:.85rem;color:var(--muted)"></span></p>
</form>`;
  }

  function tabSettings() {
    return `
<h3 style="font-size:1.05rem">Go-live tracker API (your colleague's tool)</h3>
<form data-ad="api" class="ad-form" style="flex-wrap:wrap">
  ${input('baseUrl', 'https://tracker.example.com', db.api.baseUrl, 'url')}
  ${input('token', 'API token', db.api.token, 'password')}
  <button class="btn accent">Save</button>
</form>
<p style="font-size:.8rem;color:var(--muted)">Expected endpoint: <code>GET {baseUrl}/api/v1/golives</code> with <code>Authorization: Bearer &lt;token&gt;</code> — full shape in <code>docs/API-CONTRACT.md</code>. If the tracker isn't ready, use JSON import on the Go-lives tab.</p>
<h3 style="font-size:1.05rem;margin-top:1.6em">Platform URL (used in invite emails)</h3>
<form data-ad="url" class="ad-form">
  ${input('platformUrl', 'https://…link where the academy is hosted', db.platformUrl, 'url')}
  <button class="btn accent">Save</button>
</form>
<h3 style="font-size:1.05rem;margin-top:1.6em">Data</h3>

${db.sample ? '<p style="font-size:.78rem;color:var(--muted)">This console is currently populated with 10 sample installers so stakeholders can see how scores, integrity flags, and ratings will look. Clearing removes all sample records and starts fresh.</p>' : ''}`;
  }

  /* ---------- events ---------- */
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-ad]');
    if (!f) return;
    e.preventDefault();
    const kind = f.dataset.ad;
    const val = n => (f.elements[n] ? f.elements[n].value.trim() : '');
    if (kind === 'invite') {
      if (!val('email')) return;
      db.users.push({ name: val('name'), email: val('email'), role: val('role'), invitedAt: Date.now(), status: 'invited' });
      save(); A.appHooks.rerender();
    }
    else if (kind === 'addgl') {
      db.golives.push({ id: 'GL-' + Math.floor(1000 + (db.golives.length + 1) * 7 + (Date.now() % 89)), site: val('site'), installerEmail: val('installerEmail'), date: val('date'), status: val('status'), issues: [], source: 'manual' });
      save(); A.appHooks.rerender();
    }
    else if (kind === 'import') {
      try {
        const arr = JSON.parse(val('json'));
        if (!Array.isArray(arr)) throw 0;
        arr.forEach(g => {
          const i = db.golives.findIndex(x => x.id === g.id);
          if (i >= 0) db.golives[i] = Object.assign(db.golives[i], g, { source: 'import' });
          else db.golives.push(Object.assign({ issues: [] }, g, { source: 'import' }));
        });
        save(); A.appHooks.rerender();
      } catch (err) { alert('Could not parse that JSON — expected an array of go-live objects.'); }
    }
    else if (kind === 'rate') {
      const glId = f.dataset.gl;
      const g = db.golives.find(x => x.id === glId);
      const metrics = {}; let score = 0;
      A.METRICS.forEach(m => { metrics[m[0]] = !!f.elements[m[0]].checked; if (metrics[m[0]]) score++; });
      const idx = db.ratings.findIndex(r => r.goLiveId === glId);
      const rec = { goLiveId: glId, installerEmail: g ? g.installerEmail : '', metrics, score, note: val('note'), badLaunch: !!f.elements.badLaunch.checked, ratedAt: Date.now() };
      if (idx >= 0) db.ratings[idx] = rec; else db.ratings.push(rec);
      save(); location.hash = '#/admin/golives';
    }
    else if (kind === 'api') { db.api.baseUrl = val('baseUrl').replace(/\/$/, ''); db.api.token = val('token'); save(); A.appHooks.rerender(); }
    else if (kind === 'url') { db.platformUrl = val('platformUrl'); save(); A.appHooks.rerender(); }
  });

  document.addEventListener('click', e => {
    const del = e.target.closest('[data-ad="deluser"]');
    if (del) { db.users.splice(+del.dataset.i, 1); save(); A.appHooks.rerender(); return; }
    const clearSeed = e.target.closest('[data-ad="clearseed"]');
    if (clearSeed) {
      db = { pin: null, users: [], golives: [], ratings: [], results: [], api: { baseUrl: '', token: '', lastSync: null }, platformUrl: db.platformUrl, sampleCleared: true };
      save(); A.appHooks.rerender();
      return;
    }
    const exp = e.target.closest('[data-ad="export"]');
    if (exp) {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'gmp-admin-data.json'; a.click();
      return;
    }
    const sync = e.target.closest('[data-ad="sync"]');
    if (sync) {
      const msg = document.getElementById('syncMsg');
      if (!db.api.baseUrl) { msg.textContent = 'Set the tracker API base URL in Settings first.'; return; }
      msg.textContent = 'Syncing…';
      fetch(db.api.baseUrl + '/api/v1/golives', { headers: db.api.token ? { Authorization: 'Bearer ' + db.api.token } : {} })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          const arr = Array.isArray(data) ? data : (data.golives || []);
          arr.forEach(g => {
            const i = db.golives.findIndex(x => x.id === g.id);
            if (i >= 0) db.golives[i] = Object.assign(db.golives[i], g, { source: 'api' });
            else db.golives.push(Object.assign({ issues: [] }, g, { source: 'api' }));
          });
          db.api.lastSync = Date.now(); save(); A.appHooks.rerender();
        })
        .catch(err => { msg.textContent = 'Sync failed: ' + err.message + ' (CORS/network? — JSON import always works)'; });
      return;
    }
  });

  /* live score preview while rating */
  document.addEventListener('change', e => {
    const f = e.target.closest('form[data-ad="rate"]');
    if (!f) return;
    let score = 0;
    A.METRICS.forEach(m => { if (f.elements[m[0]].checked) score++; });
    const el = document.getElementById('rateScore');
    if (el) el.textContent = 'Current score: ' + score + '/10';
  });
})();

/* ============================================================
   GMP Access Installer Academy — application engine v2

(function () {

  const KEY = 'gmpAcademyV1';
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
  state.lessons = state.lessons || {};
  state.quizzes = state.quizzes || {};
  state.exam = state.exam || null;
  state.fieldChecks = state.fieldChecks || {};
  state.sections = state.sections || {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  A.appHooks = { getState: () => state, save, rerender: () => route() };

  /* ---------- helpers ---------- */
  const mod = id => A.modules.find(m => m.id === id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hydrate = html => html.replace(/\[\[DIAGRAM:(\w+)\]\]/g, (_, n) => (D[n] ? D[n]() : ''));

  function lessonDone(mid, lid) { return !!state.lessons[mid + '/' + lid]; }
  function quizPassed(mid) { const q = state.quizzes[mid]; return q && q.total && (q.score / q.total) >= 0.7; }
  function moduleLessonsDone(m) { return m.lessons.every(l => lessonDone(m.id, l.id)); }
  function moduleComplete(m) { return moduleLessonsDone(m) && quizPassed(m.id); }
  function moduleState(m) {
    if (moduleComplete(m)) return 'done';
    const any = m.lessons.some(l => lessonDone(m.id, l.id)) || state.quizzes[m.id];
    return any ? 'progress' : 'todo';
  }
  function overallPct() {
    let done = 0, total = 0;
    A.modules.forEach(m => {
      total += m.lessons.length + 1;
      m.lessons.forEach(l => { if (lessonDone(m.id, l.id)) done++; });
      if (quizPassed(m.id)) done++;
    });
    return total ? Math.round(done / total * 100) : 0;
  }
  function phasePct(pn) {
    const mods = A.modules.filter(m => m.phase === pn);
    const done = mods.filter(moduleComplete).length;
    return `${done}/${mods.length} complete`;
  }
  function secOpen(id, def) { return state.sections[id] === undefined ? def : !!state.sections[id]; }

  /* ---------- rail ---------- */
  const RAIL = [
    { id: 'home', ico: 'home', label: 'Home', href: '#/', match: h => h === '#/' || h === '#' || h === '' },
    { id: 'modules', ico: 'grid', label: 'Modules', panel: true, match: h => h.startsWith('#/module/') },
    { id: 'field', ico: 'bolt', label: 'Field kit', href: '#/field', match: h => h.startsWith('#/field') },
    { id: 'exam', ico: 'check', label: 'Exam', href: '#/exam', match: h => h === '#/exam' },
    { id: 'guide', ico: 'printer', label: 'Guide', href: '#/guide', match: h => h === '#/guide' },
    { id: 'admin', ico: 'gear', label: 'Admin', href: '#/admin', match: h => h.startsWith('#/admin') }
  ];
  function renderRail(hash) {
    const rail = $('#rail');
    let h = `<a class="rail-logo" href="#/" title="GMP Access Installer Academy">GMP</a>`;
    RAIL.forEach(r => {
      const active = r.match(hash);
      if (r.panel) h += `<button class="rail-item${active ? ' active' : ''}" id="railModules" title="Browse all modules"><span class="ri">${UI(r.ico, 19)}</span>${r.label}</button>`;
      else h += `<a class="rail-item${active ? ' active' : ''}" href="${r.href}"><span class="ri">${UI(r.ico, 19)}</span>${r.label}</a>`;
    });
    h += `<div class="rail-spacer"></div>`;
    const pct = overallPct();
    h += `<div class="rail-progress" title="Curriculum progress"><div class="ring" style="background:conic-gradient(var(--accent-bright) ${pct * 3.6}deg, var(--line) 0)"><span style="background:var(--bg);border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center">${pct}%</span></div></div>`;

  function viewLesson(m, l) {

    const done = lessonDone(m.id, l.id);
    let h = `<span class="kicker">${esc(m.code)} · Lesson ${i + 1} of ${m.lessons.length}</span><h2 class="page-title">${esc(l.title)}</h2>`;

    h += `<div class="prose">${hydrate(l.html)}</div>`;
    h += `<div class="lesson-nav">`;
    if (i > 0) h += `<a class="btn secondary" href="#/module/${m.id}/lesson/${m.lessons[i - 1].id}">← ${esc(m.lessons[i - 1].title)}</a>`;
    else h += `<a class="btn secondary" href="#/module/${m.id}">← Module overview</a>`;
    h += `<span class="spacer"></span>`;
    const nextHref = i < m.lessons.length - 1 ? `#/module/${m.id}/lesson/${m.lessons[i + 1].id}` : `#/module/${m.id}/quiz`;
    h += `<button class="btn ${done ? 'secondary' : ''}" id="markBtn" data-m="${m.id}" data-l="${l.id}" data-next="${nextHref}">${done ? 'Completed ✓ — ' + (i < m.lessons.length - 1 ? 'next lesson' : 'knowledge check') + ' →' : 'Mark complete & continue →'}</button>`;
    h += `</div>`;
    return { crumb: `${m.code} · <b>${esc(l.title)}</b>`, html: h };
  }

  /* ---------- quiz engine ---------- */
  let quizRun = null;
  function viewQuiz(m) {
    quizRun = { mid: m.id, questions: m.quiz, answers: new Array(m.quiz.length).fill(null) };
    let h = `<span class="kicker">${esc(m.code)} · Knowledge check</span><h2 class="page-title">${esc(m.title)} — Knowledge Check</h2>
    <p class="lede">${m.quiz.length} questions. Answers reveal immediately with the source reference. Score 70%+ to complete the module.</p>`;
    h += quizBody(m.quiz);
    return { crumb: `${m.code} · <b>Knowledge check</b>`, html: h };
  }
  let examStarted = false;
  function viewExam() {
    let h = `<span class="kicker">Final validation</span><h2 class="page-title">${esc(A.examMeta.title)}</h2>
    <p class="lede">${A.exam.length} questions drawn from every module — hardware, lane design, wiring, configuration, testing, POS, and network readiness. Pass mark: ${A.examMeta.pass}%.</p>`;
    if (!examStarted) {
      if (state.exam) h += `<div class="callout ${state.exam.passed ? 'good' : 'warn'}"><span class="co-label">Previous best</span><p>${Math.round(state.exam.best)}% — ${state.exam.passed ? 'passed. Retaking only raises your record.' : 'not yet passing. Review the flagged modules and retake.'}</p></div>`;
      h += `<div class="exam-cover">
        <h3 style="margin:.2em 0 .5em">Before you begin</h3>
        <form id="examProfile" class="ad-form" style="margin:10px 0 4px">
          <input class="ad-in" name="pname" placeholder="Your name" value="${esc(state.profile ? state.profile.name : '')}" required>
          <input class="ad-in" name="pemail" type="email" placeholder="you@company.com" value="${esc(state.profile ? state.profile.email : '')}" required>
          <button class="btn accent">Begin exam →</button>
        </form>
        <p class="exam-rules">This is a focused session: complete it in this window, in one sitting. Session activity is recorded with your attempt.</p>
      </div>`;
      return { crumb: '<b>Final Readiness Exam</b>', html: h };
    }
    quizRun = { mid: 'exam', questions: A.exam, answers: new Array(A.exam.length).fill(null) };
    h += `<div class="exam-live-bar"><span>Focused session in progress — answer all ${A.exam.length} questions.</span><button class="btn small ghost" data-action="abandon-exam">Abandon attempt</button></div>`;
    h += quizBody(A.exam);
    return { crumb: '<b>Final Readiness Exam · in progress</b>', html: h };
  }
  function quizBody(questions) {
    let h = '';
    questions.forEach((q, qi) => {
      h += `<div class="quiz-q" id="q${qi}"><span class="qnum">Question ${qi + 1} / ${questions.length}</span>${q.type === 'scenario' ? '<span class="scenario-tag">Scenario</span>' : ''}<h4>${esc(q.stem)}</h4>`;
      q.options.forEach((o, oi) => {
        h += `<div class="opt" data-q="${qi}" data-o="${oi}"><span class="dot">${String.fromCharCode(65 + oi)}</span><span>${esc(o)}</span></div>`;
      });
      h += `<div class="explain-slot"></div></div>`;
    });
    h += `<div id="quizResult"></div>`;
    return h;
  }
  function handleOptionClick(el) {
    if (!quizRun) return;
    const qi = +el.dataset.q, oi = +el.dataset.o;
    if (quizRun.answers[qi] !== null) return;
    quizRun.answers[qi] = oi;
    const q = quizRun.questions[qi];
    const box = document.getElementById('q' + qi);
    box.querySelectorAll('.opt').forEach(opt => {
      const o = +opt.dataset.o;
      if (o === q.answer) opt.classList.add('correct');
      else if (o === oi) opt.classList.add('wrong');
      opt.style.cursor = 'default';
    });
    const right = oi === q.answer;
    box.querySelector('.explain-slot').innerHTML =
      `<div class="explain${right ? '' : ' miss'}"><b>${right ? 'Correct.' : 'Not quite.'}</b> ${esc(q.explain)}${q.source ? ` <span class="src">[${esc(q.source)}]</span>` : ''}</div>`;
    if (quizRun.answers.every(a => a !== null)) finishQuiz();
  }
  function finishQuiz() {
    const qs = quizRun.questions;
    const score = quizRun.answers.filter((a, i) => a === qs[i].answer).length;
    const pct = score / qs.length * 100;
    const res = document.getElementById('quizResult');
    if (quizRun.mid === 'exam') {
      const passed = pct >= A.examMeta.pass;
      const prev = state.exam || { best: 0, passed: false };
      const integrity = window.PROCTOR ? window.PROCTOR.stop('finished') : null;
      examStarted = false;
      state.exam = { best: Math.max(prev.best, pct), passed: prev.passed || passed, integrity };
      save();
      if (A.adminHooks) A.adminHooks.recordResult({
        kind: 'exam', name: state.profile && state.profile.name, email: state.profile && state.profile.email,
        score, total: qs.length, pct, integrity, ts: Date.now()
      });
      res.innerHTML = `<div class="quiz-score"><div class="big">${score}/${qs.length} — ${Math.round(pct)}%</div>
        <p>${passed ? UI('check', 15) + ' Readiness exam passed. You have demonstrated end-to-end command of the GMP Access install program — hardware through handoff.' : `Pass mark is ${A.examMeta.pass}%. Review the modules referenced in the questions you missed, then retake.`}</p>
        <p><a class="btn accent" href="#/exam">Retake</a> <a class="btn secondary" href="#/" style="margin-left:8px">Home</a></p></div>`;
    } else {
      state.quizzes[quizRun.mid] = { score, total: qs.length, ts: Date.now() };
      save();
      if (A.adminHooks) A.adminHooks.recordResult({
        kind: 'quiz', module: (mod(quizRun.mid) || {}).code, name: state.profile && state.profile.name,
        email: state.profile && state.profile.email, score, total: qs.length, pct, ts: Date.now()
      });
      const passed = pct >= 70;
      const m = mod(quizRun.mid);
      const idx = A.modules.indexOf(m);
      const next = A.modules[idx + 1];
      res.innerHTML = `<div class="quiz-score"><div class="big">${score}/${qs.length}</div>
        <p>${passed ? UI('check', 15) + ' Knowledge check passed' + (moduleLessonsDone(m) ? ' — module complete.' : ' — finish the remaining lessons to complete the module.') : 'Below 70% — review the lessons and retake to complete the module.'}</p>
        <p>${passed && next ? `<a class="btn accent" href="#/module/${next.id}">Next module: ${esc(next.code)} →</a>` : `<a class="btn accent" href="#/module/${quizRun.mid}/quiz">Retake</a>`}
        <a class="btn secondary" href="#/module/${quizRun.mid}" style="margin-left:8px">Module overview</a></p></div>`;
      renderRail(location.hash || '#/');
    }
    res.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------- field card (dark on-site view) ---------- */
  function viewFieldCard(cardId) {
    const c = A.fieldCards.find(x => x.id === cardId);
    if (!c) return viewHome({ scrollTo: 'field' });
    document.body.classList.add('field-mode');
    let h = `<div class="field-head"><div><span class="kicker">Field kit · on-site view</span><h2>${UI(c.icon, 22)} ${esc(c.title)}</h2></div></div><div class="field-panel">`;
    if (c.checklist) {
      const st = state.fieldChecks[c.id] || {};
      h += `<ul class="checklist">`;
      c.checklist.forEach((item, i) => {
        h += `<li data-card="${c.id}" data-i="${i}" class="${st[i] ? 'done' : ''}"><span class="box">✓</span><span class="txt">${item.t}${item.why ? `<span class="why">${item.why}</span>` : ''}</span></li>`;
      });
      h += `</ul><p style="margin-top:14px"><button class="btn secondary small" id="resetChecks" data-card="${c.id}">Reset checklist</button></p>`;
    }
    if (c.html) h += hydrate(c.html);
    h += `<p class="src" style="color:var(--dark-muted)">Source: GMP Access Install V3, ${esc(c.source)}</p></div>
    <p><a class="btn secondary" href="#/field">← All field cards</a></p>`;
    return { crumb: `Field kit · <b>${esc(c.title)}</b>`, html: `<div class="field-wrap">${h}</div>`, bare: true };
  }

  /* ---------- coverage map ---------- */
  function viewCoverage() {
    let h = `<span class="kicker">Content fidelity</span><h2 class="page-title">Source Coverage Map</h2>
    <p class="lede">Every section of <em>GMP Access Install V3</em> mapped to where it lives in this academy. Ambiguities in the source are flagged in-line in the lessons rather than silently resolved.</p>
    <div class="tablewrap"><table class="spec wraprow">
    <tr><th>Source section (page)</th><th>Location here</th><th>Treatment</th></tr>`;
    A.coverage.forEach(r => {
      h += `<tr class="cov-row"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`;
    });
    h += `</table></div>
    <div class="callout ambiguity"><span class="co-label">Known source ambiguities — flagged, not guessed</span>
    <ul>
      <li>iPro camera priced ~$1,100 (p.7) vs ~$1,500 (p.24) → both shown, flagged in M03.</li>
      <li>Zentron 21 dimension table prints two heights (55.8" H … 22.5" H) → flagged in M04.</li>
      <li>USB section mentions "Ubuntu 18.04 iso" once while specifying 24.04.03 LTS → flagged in M10; 24.04.03 operative.</li>
      <li>WISE Windows steps say set PC to 10.0.0.1, contradicting the guide's own warning and its 10.0.0.2 instruction → flagged and resolved per the warning in M11.</li>
      <li>Presence loop: descriptive text says signal at NO5; connection step says DI0 → NC5 → both reproduced in M08 with a verify-by-metal-test note.</li>
      <li>Tap &amp; Park section's lead sentence is truncated in the source → noted in M13; available steps fully reproduced.</li>
      <li>Purchase URLs are embedded hyperlinks in the PDF (not printed text) → item list + coordination rules preserved in M06; keep the PDF for the live links.</li>
    </ul></div>`;
    return { crumb: '<b>Coverage map</b>', html: h };
  }

  /* ---------- printable guide ---------- */
  function viewGuide() {
    let h = `<div class="print-controls no-print"><b style="font-size:.9rem">Printable Field Guide</b>
      <span style="color:var(--muted);font-size:.8rem;flex:1">Complete curriculum + field reference, print-optimized. Use your browser's "Save as PDF" for a downloadable copy.</span>
      <button class="btn accent" onclick="window.print()">Print / Save as PDF</button></div>
    <div class="guide">
      <div class="g-cover"><p class="kicker">GMP Access · Partner Installer Program</p>
      <h1>Installer Field Guide</h1>
      <p>The complete GMP Access (IoT GateKit) installation curriculum<br>compiled from <em>Access Install V3</em></p>
      <p class="src">For authorized use only · Generated by the GMP Access Installer Academy</p></div>`;
    A.phaseMeta.forEach(p => {
      const mods = A.modules.filter(m => m.phase === p.n);
      mods.forEach(m => {
        h += `<div class="g-module"><h2>${esc(m.code)} — ${esc(m.title)}</h2><p><em>${esc(m.tagline)}</em></p>`;
        m.lessons.forEach(l => { h += `<div class="g-lesson"><h3>${esc(l.title)}</h3><div class="prose">${hydrate(l.html)}</div></div>`; });
        h += `</div>`;
      });
    });
    h += `<div class="g-module"><h2>Field Reference Cards</h2>`;
    A.fieldCards.forEach(c => {
      h += `<div class="g-lesson light"><h3>${esc(c.title)}</h3>`;
      if (c.checklist) h += `<ul>${c.checklist.map(i => `<li>☐ ${i.t}${i.why ? ` — <em>${i.why}</em>` : ''}</li>`).join('')}</ul>`;
      if (c.html) h += `<div class="prose">${hydrate(c.html)}</div>`;
      h += `<p class="src">Source: ${esc(c.source)}</p></div>`;
    });
    h += `</div></div>`;
    return { crumb: '<b>Printable Field Guide</b>', html: h, wide: true, noPad: true };
  }

  /* ---------- search ---------- */
  let searchIndex = null;
  function buildIndex() {
    if (searchIndex) return searchIndex;
    searchIndex = [];
    const strip = html => html.replace(/\[\[DIAGRAM:\w+\]\]/g, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
    A.modules.forEach(m => m.lessons.forEach(l => {
      searchIndex.push({ where: `${m.code} · ${l.title}`, text: (l.title + ' ' + strip(l.html)).toLowerCase(), href: `#/module/${m.id}/lesson/${l.id}` });
    }));
    A.fieldCards.forEach(c => {
      const t = (c.title + ' ' + c.desc + ' ' + (c.html ? strip(c.html) : '') + ' ' + (c.checklist ? c.checklist.map(i => i.t).join(' ') : '')).toLowerCase();
      searchIndex.push({ where: `Field · ${c.title}`, text: t, href: `#/field/${c.id}` });
    });
    A.glossary.forEach(g => {
      searchIndex.push({ where: `Glossary · ${g.term}`, text: (g.term + ' ' + g.def).toLowerCase(), href: `#/glossary` });
    });
    return searchIndex;
  }
  function doSearch(q) {
    const box = $('#searchResults');
    q = q.trim().toLowerCase();
    if (q.length < 2) { box.style.display = 'none'; return; }
    const hits = buildIndex().filter(e => e.text.includes(q)).slice(0, 12);
    box.innerHTML = hits.length
      ? hits.map(hit => {
          const pos = hit.text.indexOf(q);
          const ctx = hit.text.slice(Math.max(0, pos - 40), pos + 60);
          return `<a href="${hit.href}"><span class="where">${esc(hit.where)}</span>…${esc(ctx)}…</a>`;
        }).join('')
      : '<div class="none">No matches in the curriculum, field cards, or glossary.</div>';
    box.style.display = 'block';
  }

  /* ---------- router ---------- */
  function closePanel() { document.body.classList.remove('panel-open'); }
  function route() {
    const hash = location.hash || '#/';
    // exam lock: while a focused session is running, quietly log & bounce navigation
    if (window.PROCTOR && window.PROCTOR.active && hash !== '#/exam') {
      window.PROCTOR.note('nav-attempt', hash);
      location.hash = '#/exam';
      return;
    }
    document.body.classList.remove('field-mode');
    closePanel();
    let v;
    const parts = hash.slice(2).split('/');
    if (hash === '#/' || hash === '#') v = viewHome();
    else if (parts[0] === 'welcome') v = viewHome({ scrollTo: 'start', open: 'start' });
    else if (parts[0] === 'glossary') v = viewHome({ scrollTo: 'glossary', open: 'glossary' });
    else if (parts[0] === 'field' && !parts[1]) v = viewHome({ scrollTo: 'field', open: 'field' });
    else if (parts[0] === 'field' && parts[1]) v = viewFieldCard(parts[1]);
    else if (parts[0] === 'module' && parts[1]) {
      const m = mod(parts[1]);
      if (!m) v = viewHome();
      else if (parts[2] === 'lesson' && parts[3]) {
        const l = m.lessons.find(x => x.id === parts[3]);
        v = l ? viewLesson(m, l) : viewModule(m);
      }
      else if (parts[2] === 'quiz') v = viewQuiz(m);
      else v = viewModule(m);
    }
    else if (parts[0] === 'exam') v = viewExam();
    else if (parts[0] === 'admin') v = A.viewAdmin(parts.slice(1));
    else if (parts[0] === 'coverage') v = viewCoverage();
    else if (parts[0] === 'guide') v = viewGuide();
    else v = viewHome();

    // route-level section opening (e.g. #/glossary)
    if (v.scrollTo || (parts[0] === 'welcome' || parts[0] === 'glossary' || (parts[0] === 'field' && !parts[1]))) {
      const target = v.scrollTo;
      if (target) state.sections[target] = true;
    }

    const content = $('#content');
    content.className = 'content' + (v.wide ? ' wide' : '');
    if (v.noPad) content.style.padding = '0'; else content.style.padding = '';
    if (v.bare) content.style.maxWidth = 'none'; else content.style.maxWidth = '';
    content.innerHTML = v.html;
    $('#crumb').innerHTML = v.crumb || '';
    $('#searchResults').style.display = 'none';
    renderRail(hash);
    renderPanel(hash);
    if (v.scrollTo) {
      const sec = document.querySelector(`details.sect[data-sec="${v.scrollTo}"]`);
      if (sec) { sec.open = true; setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); }
    } else window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (opt) { handleOptionClick(opt); return; }
    const mark = e.target.closest('#markBtn');
    if (mark) {
      state.lessons[mark.dataset.m + '/' + mark.dataset.l] = true;
      save();
      location.hash = mark.dataset.next;
      return;
    }
    const check = e.target.closest('.checklist li');
    if (check && check.dataset.card) {
      const cid = check.dataset.card, i = check.dataset.i;
      state.fieldChecks[cid] = state.fieldChecks[cid] || {};
      state.fieldChecks[cid][i] = !state.fieldChecks[cid][i];
      check.classList.toggle('done', !!state.fieldChecks[cid][i]);
      save();
      return;
    }
    const reset = e.target.closest('#resetChecks');
    if (reset) { delete state.fieldChecks[reset.dataset.card]; save(); route(); return; }
    if (e.target.closest('#railModules') || e.target.closest('#hamburger')) {
      document.body.classList.toggle('panel-open');
      return;
    }
    if (e.target.closest('.np-close') || e.target.closest('.panel-scrim')) { closePanel(); return; }
    if (e.target.closest('.np-link')) closePanel();
    const tourBtn = e.target.closest('[data-action="tour"]');
    if (tourBtn) { A.startTour(); return; }
    const abandon = e.target.closest('[data-action="abandon-exam"]');
    if (abandon) {
      const integrity = window.PROCTOR ? window.PROCTOR.stop('abandoned') : null;
      examStarted = false; quizRun = null;
      if (A.adminHooks) A.adminHooks.recordResult({
        kind: 'exam', name: state.profile && state.profile.name, email: state.profile && state.profile.email,
        score: 0, total: A.exam.length, pct: 0, integrity, ts: Date.now()
      });
      location.hash = '#/';
      return;
    }
    if (!e.target.closest('.search-box')) $('#searchResults').style.display = 'none';
  });
  // persist collapsible section state
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d.matches && d.matches('details[data-sec]')) {
      state.sections[d.dataset.sec] = d.open;
      save();
    }
  }, true);
  document.addEventListener('submit', e => {
    const f = e.target.closest('#examProfile');
    if (!f) return;
    e.preventDefault();
    state.profile = { name: f.elements.pname.value.trim(), email: f.elements.pemail.value.trim() };
    save();
    examStarted = true;
    if (window.PROCTOR) window.PROCTOR.start();
    route();
  });
  $('#searchInput').addEventListener('input', e => doSearch(e.target.value));
  $('#searchInput').addEventListener('focus', e => doSearch(e.target.value));
  window.addEventListener('hashchange', route);
  route();
})();
</script>
